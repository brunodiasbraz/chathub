version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env   
    command: /bin/sh -c "npm install && npm run build && npm run api:start"
    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "3333:3333"
    env_file:
      - ./frontend/.env
    command: /bin/sh -c "npm install && npm run build && npm install -g serve && serve -s build -l 3333"
    environment:
      - CI=true

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: Cercred5
      MYSQL_DATABASE: press-ticket
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
